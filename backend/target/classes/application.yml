server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db.rtfxnjhmvzpwaknakwcj.supabase.co:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driverClassName: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_ISSUER_URI:https://rtfxnjhmvzpwaknakwcj.supabase.co/auth/v1}

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-this-jwt-secret-in-env}
    issuer: gttc-lms
    expiryMinutes: 480

  frontendUrls: ${APP_FRONTEND_URLS:https://gttclms.vercel.app}

  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:}
    bootstrapEmail: ${APP_ADMIN_BOOTSTRAP_EMAIL:}

  google:
    clientId: ${APP_GOOGLE_CLIENT_ID:}

  mail:
    mode: ${APP_MAIL_MODE:resend}
    from: ${APP_MAIL_FROM:onboarding@resend.dev}
    resend:
      apiKey: ${APP_RESEND_API_KEY:}

  storage:
    uploadDir: ${APP_UPLOAD_DIR:uploads}

  warmup:
    enabled: ${APP_WARMUP_ENABLED:true}
    fixedDelayMs: ${APP_WARMUP_FIXED_DELAY_MS:300000}
    initialDelayMs: ${APP_WARMUP_INITIAL_DELAY_MS:120000}

  demo:
    openAccess: ${APP_DEMO_OPEN_ACCESS:true}
    userEmail: ${APP_DEMO_USER_EMAIL:demo@gttc.local}

  azure:
    face:
      endpoint: ${APP_AZURE_FACE_ENDPOINT:}
      apiKey: ${APP_AZURE_FACE_API_KEY:}
      recognitionModel: ${APP_AZURE_FACE_RECOGNITION_MODEL:recognition_04}
      connectTimeoutMs: ${APP_AZURE_FACE_CONNECT_TIMEOUT_MS:7000}
      readTimeoutMs: ${APP_AZURE_FACE_READ_TIMEOUT_MS:15000}

  face:
    qrSessionMinutes: ${APP_FACE_QR_SESSION_MINUTES:10}

  chatbot:
    geminiApiKey: ${APP_CHATBOT_GEMINI_API_KEY:}
    geminiModel: ${APP_CHATBOT_GEMINI_MODEL:gemini-2.0-flash}
    geminiFallbackModels: ${APP_CHATBOT_GEMINI_FALLBACK_MODELS:gemini-2.0-flash,gemini-1.5-flash,gemini-1.5-flash-latest}
    geminiBaseUrl: ${APP_CHATBOT_GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    connectTimeoutMs: ${APP_CHATBOT_CONNECT_TIMEOUT_MS:10000}
    readTimeoutMs: ${APP_CHATBOT_READ_TIMEOUT_MS:45000}
