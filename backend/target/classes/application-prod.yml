spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db.rtfxnjhmvzpwaknakwcj.supabase.co:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driverClassName: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  admin:
    bootstrapEmail: ${APP_ADMIN_BOOTSTRAP_EMAIL:}
  google:
    allowTestToken: false
  mail:
    mode: ${APP_MAIL_MODE:resend}
    from: ${APP_MAIL_FROM:onboarding@resend.dev}
    resend:
      apiKey: ${APP_RESEND_API_KEY:}
  warmup:
    enabled: ${APP_WARMUP_ENABLED:true}
    fixedDelayMs: ${APP_WARMUP_FIXED_DELAY_MS:300000}
    initialDelayMs: ${APP_WARMUP_INITIAL_DELAY_MS:120000}
  demo:
    openAccess: ${APP_DEMO_OPEN_ACCESS:true}
    userEmail: ${APP_DEMO_USER_EMAIL:demo@gttc.local}
  azure:
    face:
      endpoint: ${APP_AZURE_FACE_ENDPOINT:}
      apiKey: ${APP_AZURE_FACE_API_KEY:}
  face:
    qrSessionMinutes: ${APP_FACE_QR_SESSION_MINUTES:10}
  chatbot:
    geminiApiKey: ${APP_CHATBOT_GEMINI_API_KEY:}
    geminiModel: ${APP_CHATBOT_GEMINI_MODEL:gemini-flash-latest}
    geminiBaseUrl: ${APP_CHATBOT_GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
