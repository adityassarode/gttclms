server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:gttc;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: ""
    driverClassName: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 4MB

app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-secret-change-me}
    issuer: gttc-lms
    expiryMinutes: 480
  frontendUrl: ${APP_FRONTEND_URL:http://localhost:5173}
  admin:
    username: ${APP_ADMIN_USERNAME:Aditya Sarode}
    password: ${APP_ADMIN_PASSWORD:Aditya@1234}
  google:
    clientId: ${APP_GOOGLE_CLIENT_ID:}
    allowTestToken: ${APP_GOOGLE_ALLOW_TEST_TOKEN:true}
  mail:
    mode: ${APP_MAIL_MODE:console}
    from: ${APP_MAIL_FROM:gttc-library@gttc.local}
  storage:
    uploadDir: ${APP_UPLOAD_DIR:uploads}
