server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db.rtfxnjhmvzpwaknakwcj.supabase.co:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driverClassName: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:gttclmss@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 4MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_ISSUER_URI:https://rtfxnjhmvzpwaknakwcj.supabase.co/auth/v1}

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-this-jwt-secret-in-env}
    issuer: gttc-lms
    expiryMinutes: 480

  frontendUrls: ${APP_FRONTEND_URLS:https://gttclms.netlify.app}

  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:}

  google:
    clientId: ${APP_GOOGLE_CLIENT_ID:}

  mail:
    mode: ${APP_MAIL_MODE:smtp}
    from: ${APP_MAIL_FROM:gttclmss@gmail.com}

  storage:
    uploadDir: ${APP_UPLOAD_DIR:uploads}
