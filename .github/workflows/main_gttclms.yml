# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy JAR app to Azure Web App - gttclms

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "microsoft"

      - name: Build with Maven
        working-directory: backend
        run: |
          set -e
          mvn -B -U clean package -DskipTests
          JAR_PATH="target/gttc-lms-0.0.1-SNAPSHOT.jar"
          test -f "$JAR_PATH"

          # Verify this is a repackaged Spring Boot fat jar with runtime libs.
          jar tf "$JAR_PATH" | grep -q "BOOT-INF/lib/spring-orm-"
          jar tf "$JAR_PATH" | grep -q "BOOT-INF/lib/hibernate-core-"
          jar tf "$JAR_PATH" | grep -q "BOOT-INF/lib/jackson-databind-"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: "${{ github.workspace }}/backend/target/gttc-lms-0.0.1-SNAPSHOT.jar"

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app
          path: artifact

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "gttclms"
          slot-name: "Production"
          package: "artifact/gttc-lms-0.0.1-SNAPSHOT.jar"
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_DEE05594356E4297B1327AF7B36B8B6B }}
